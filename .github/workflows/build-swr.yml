name: Build and push to Huawei SWR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-swr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only master publishes. Manual dispatches on other branches are skipped so
    # the shared `latest` tag can never be overwritten by a non-master build.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # SWR organization is fixed to digitprint; SWR credentials stay in repository secrets.
    env:
      REGISTRY: swr.cn-east-3.myhuaweicloud.com
      IMAGE: swr.cn-east-3.myhuaweicloud.com/digitprint/logto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image references
        id: image
        shell: bash
        run: |
          version="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "version-ref=${IMAGE}:${version}" >> "$GITHUB_OUTPUT"
          echo "latest-ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.version-ref }},${{ steps.image.outputs.latest-ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report published images
        env:
          VERSION_REF: ${{ steps.image.outputs.version-ref }}
          LATEST_REF: ${{ steps.image.outputs.latest-ref }}
        shell: bash
        run: |
          {
            printf '### Published images\n'
            printf '| Purpose | Image reference |\n'
            printf '| --- | --- |\n'
            printf '| Deploy (latest, master) | `%s` |\n' "$LATEST_REF"
            printf '| Rollback (pinned version) | `%s` |\n' "$VERSION_REF"
          } >> "$GITHUB_STEP_SUMMARY"
