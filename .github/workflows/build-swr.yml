name: Build and push to Huawei SWR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-swr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Configure SWR_ORG in repository variables and SWR credentials in repository secrets.
    env:
      REGISTRY: swr.cn-east-3.myhuaweicloud.com
      SWR_ORG: ${{ vars.SWR_ORG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image reference
        id: image
        shell: bash
        run: |
          if [[ -z "$SWR_ORG" ]]; then
            echo "::error::Configure the SWR_ORG repository variable."
            exit 1
          fi

          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ref=${REGISTRY}/${SWR_ORG}/logto:${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report published image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          printf '### Published image\n`%s`\n' "$IMAGE_REF" \
            >> "$GITHUB_STEP_SUMMARY"
